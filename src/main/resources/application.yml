spring:
  application:
    name: enterprise-integration-hub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/integrationhub}
    username: ${DB_USERNAME:integrationhub}
    password: ${DB_PASSWORD:}
  jpa:
    # 스키마는 Flyway가 관리하고 Hibernate는 Entity와 테이블이 일치하는지만 검증한다.
    hibernate:
      ddl-auto: validate
    # 요청이 끝날 때까지 DB 연결을 붙잡지 않도록 끄고, Service 트랜잭션 안에서 DTO 변환을 끝낸다.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # 지연 로딩 컬렉션을 IN 절로 묶어 조회해 N+1 문제를 완화한다.
        default_batch_fetch_size: 100
  # JWT 검증 설정. 기본값을 두지 않는다: 환경마다(로컬, Docker, 운영) 반드시 명시해야 하며, 없으면 기동에 실패한다.
  #   issuer-uri: 토큰의 iss와 정확히 일치해야 한다 (클라이언트가 Keycloak에 접속한 외부 주소 기준).
  #   jwk-set-uri: 서명 검증용 공개키(JWKS) 주소. Docker에서는 내부 주소(keycloak:8080)를 쓴다.
  #   audiences: 이 API용으로 발급된 토큰만 받는다 (다른 Client용 토큰 재사용 방지).
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI}
          audiences: integration-hub-api
  data:
    web:
      pageable:
        max-page-size: 100
    # 현재는 연결 확인(Actuator health)만 한다. 캐시 기능은 아직 사용하지 않는다.
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}

# 외부 시스템(ERP, MES) 연계. 로컬 기본값은 docker compose의 mock-erp(8081), mock-mes(8082).
integration:
  erp:
    base-url: ${ERP_BASE_URL:http://localhost:8081}
    connect-timeout: ${ERP_CONNECT_TIMEOUT:2s}
    read-timeout: ${ERP_READ_TIMEOUT:3s}
  mes:
    base-url: ${MES_BASE_URL:http://localhost:8082}
    connect-timeout: ${MES_CONNECT_TIMEOUT:2s}
    read-timeout: ${MES_READ_TIMEOUT:3s}

logging:
  # 모든 로그 줄에 요청 ID를 붙인다 (RequestIdFilter가 MDC에 저장). 요청 밖의 로그는 빈 값.
  pattern:
    correlation: "[%X{requestId:-}] "
  level:
    org.hibernate.SQL: debug

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # 구성 요소(db, redis)별 UP/DOWN만 노출하고 접속 정보 같은 상세 내용은 숨긴다.
      show-components: always
