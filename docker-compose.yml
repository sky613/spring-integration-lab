services:
  postgres:
    image: postgres:17-alpine
    container_name: integration-hub-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-integrationhub}
      POSTGRES_USER: ${DB_USERNAME:-integrationhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required. Copy .env.example to .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    image: enterprise-integration-hub:local
    container_name: enterprise-integration-hub
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Host port is overridable when 8080 is already in use: APP_PORT=18080 docker compose up
      - "${APP_PORT:-8080}:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-integrationhub}
      DB_USERNAME: ${DB_USERNAME:-integrationhub}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required. Copy .env.example to .env}
    restart: unless-stopped

volumes:
  postgres-data:
