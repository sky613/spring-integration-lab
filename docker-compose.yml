# 사용법: cp .env.example .env (비밀번호 변경) → docker compose up -d --build
# 모든 포트는 127.0.0.1에만 바인딩한다. 같은 네트워크의 다른 기기에서는 접근할 수 없다.
# 접근 구조: Client → api-gateway(:8080) → core-api → mock-erp, mock-mes
#   core-api, mock-erp, mock-mes는 호스트 포트를 열지 않는다. 외부 요청은 Gateway만 통과한다.
#   mock-erp, mock-mes는 integration 네트워크에만 있어 Gateway에서도 직접 접근할 수 없다.
# keycloak(:8180)은 개발용 IAM이다 (start-dev, HTTP, 내장 DB, 테스트 사용자). 운영 설정으로 쓰지 않는다.
name: integration-hub

services:
  postgres:
    image: postgres:17-alpine
    container_name: integration-hub-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-integrationhub}
      POSTGRES_USER: ${DB_USERNAME:-integrationhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required. Copy .env.example to .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # Named Volume: 컨테이너를 삭제·재생성해도 DB 데이터가 유지된다.
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: integration-hub-redis
    # 비밀번호 인증을 켠다. 캐시 데이터는 아직 없으므로 디스크 저장(RDB/AOF)은 끈다.
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\" --save '' --appendonly no"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required. Copy .env.example to .env}
      # redis-cli가 이 값으로 인증한다 (명령줄에 비밀번호를 노출하지 않음).
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ERP·MES Mock (WireMock). 응답과 장애 시나리오는 mock/*/mappings의 JSON으로 정의한다.
  # 내부 시스템이므로 호스트 포트 없이 integration 네트워크(core-api만 접근)에만 둔다.
  mock-erp:
    image: wiremock/wiremock:3.13.1
    container_name: integration-hub-mock-erp
    volumes:
      - ./mock/erp/mappings:/home/wiremock/mappings:ro
    networks:
      - integration
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mock-mes:
    image: wiremock/wiremock:3.13.1
    container_name: integration-hub-mock-mes
    volumes:
      - ./mock/mes/mappings:/home/wiremock/mappings:ro
    networks:
      - integration
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 개발 전용 Keycloak. 운영에서는 start(빌드된 설정) + HTTPS + 외부 DB + 별도 Realm 설정을 사용한다.
  # Realm(역할, Client, 테스트 사용자)은 기동 시 keycloak/realm-integration-hub.dev.json에서 가져온다.
  # 테스트 사용자 비밀번호는 파일에 없고 .env 값이 ${KC_TEST_*_PASSWORD} 자리에 주입된다.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.5
    container_name: integration-hub-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required. Copy .env.example to .env}
      # 토큰의 iss는 브라우저(클라이언트)가 접속하는 주소로 고정한다. 컨테이너 간 통신(keycloak:8080)은 backchannel로 허용.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_TEST_USER_PASSWORD: ${KC_TEST_USER_PASSWORD:?KC_TEST_USER_PASSWORD is required. Copy .env.example to .env}
      KC_TEST_ADMIN_PASSWORD: ${KC_TEST_ADMIN_PASSWORD:?KC_TEST_ADMIN_PASSWORD is required. Copy .env.example to .env}
    volumes:
      - ./keycloak/realm-integration-hub.dev.json:/opt/keycloak/data/import/realm-integration-hub.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    networks:
      - backend
    healthcheck:
      # 이미지에 curl이 없어 bash의 /dev/tcp로 관리 포트(9000) Health를 확인한다.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  core-api:
    build: .
    image: enterprise-integration-hub:local
    container_name: integration-hub-core-api
    # DB와 Redis가 healthy 상태가 된 뒤에 시작한다 (단순 컨테이너 시작이 아니라 접속 가능 시점).
    # mock-erp, mock-mes는 일부러 넣지 않는다. 외부 시스템이 꺼져 있어도 core-api는 떠 있고 연계만 FAILED로 기록된다.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 호스트 포트 없음: api-gateway를 통해서만 접근한다.
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
      # 같은 네트워크 안에서는 서비스 이름(postgres, redis)이 호스트 이름(DNS)이 된다.
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-integrationhub}
      DB_USERNAME: ${DB_USERNAME:-integrationhub}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required. Copy .env.example to .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required. Copy .env.example to .env}
      ERP_BASE_URL: http://mock-erp:8080
      MES_BASE_URL: http://mock-mes:8080
      # JWT 검증: iss는 외부 주소(클라이언트가 받은 토큰 그대로), 공개키는 내부 주소에서 가져온다.
      # Keycloak이 늦게 떠도 core-api는 시작된다. JWKS는 첫 토큰 검증 시점에 가져온다.
      OAUTH2_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8180}/realms/integration-hub
      OAUTH2_JWK_SET_URI: http://keycloak:8080/realms/integration-hub/protocol/openid-connect/certs
    networks:
      - backend
      - integration
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: enterprise-integration-hub-gateway:local
    container_name: integration-hub-api-gateway
    depends_on:
      core-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
      SERVER_PORT: 8080
      CORE_API_URL: http://core-api:8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required. Copy .env.example to .env}
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    restart: unless-stopped

networks:
  # Gateway, core-api, postgres, redis
  backend:
    driver: bridge
  # core-api ↔ 외부 시스템(ERP, MES). Gateway는 이 네트워크에 없다.
  integration:
    driver: bridge

volumes:
  postgres-data:
