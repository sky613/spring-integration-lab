# 개발용 CI/CD 인프라: Gitea(Git 서버 + Webhook) → Jenkins(Pipeline) → Nexus(Artifact 저장소)
#   cp ci/.env.example ci/.env (비밀번호 변경) → docker compose -f ci/docker-compose.ci.yml --env-file ci/.env up -d --build
#   → ci/bootstrap.sh (저장소·계정·Webhook 초기 설정)
#
# 모든 관리 포트는 127.0.0.1에만 바인딩한다. 같은 네트워크의 다른 기기나 공개 인터넷에서 접근할 수 없다.
# 컨테이너 간 통신(Gitea Webhook → Jenkins, Jenkins → Gitea·Nexus)은 ci 네트워크의 서비스 이름을 쓴다.
name: integration-hub-ci

services:
  gitea:
    image: gitea/gitea:1.24.6
    container_name: ci-gitea
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://localhost:${GITEA_PORT:-3000}/
      GITEA__server__SSH_DISABLE: "true"
      # 설치 화면을 건너뛴다. 관리자 계정은 ci/bootstrap.sh가 CLI로 만든다.
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      # Webhook은 기본적으로 외부 주소로만 보낼 수 있다. 같은 ci 네트워크의 jenkins만 허용한다.
      GITEA__webhook__ALLOWED_HOST_LIST: jenkins
    volumes:
      - gitea-data:/data
    ports:
      - "127.0.0.1:${GITEA_PORT:-3000}:3000"
    networks:
      - ci
    restart: unless-stopped

  jenkins:
    build: ./jenkins
    image: integration-hub-jenkins:local
    container_name: ci-jenkins
    environment:
      # JCasC(casc.yaml)가 읽는 값만 넘긴다. 관리자용 비밀번호(Gitea·Nexus admin)는 Jenkins에 주지 않는다.
      JENKINS_ADMIN_USERNAME: ${JENKINS_ADMIN_USERNAME:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?JENKINS_ADMIN_PASSWORD is required}
      GITEA_BOT_USERNAME: ${GITEA_BOT_USERNAME:-jenkins-bot}
      GITEA_BOT_PASSWORD: ${GITEA_BOT_PASSWORD:?GITEA_BOT_PASSWORD is required}
      NEXUS_CI_USERNAME: ${NEXUS_CI_USERNAME:-jenkins-deployer}
      NEXUS_CI_PASSWORD: ${NEXUS_CI_PASSWORD:?NEXUS_CI_PASSWORD is required}
      JENKINS_PORT: ${JENKINS_PORT:-8090}
      GITEA_REPO_URL: http://gitea:3000/${GITEA_ADMIN_USERNAME:-ci-admin}/enterprise-integration-hub.git
      # JENKINS_HOME을 호스트와 같은 절대 경로로 마운트한다. Jenkins가 호스트 Docker로 실행하는 컨테이너
      # (docker compose 배포, Testcontainers)의 bind mount 경로가 호스트에서도 그대로 유효해야 하기 때문이다.
      JENKINS_HOME: ${JENKINS_HOME_DIR:?JENKINS_HOME_DIR is required (absolute host path)}
      CASC_JENKINS_CONFIG: /usr/share/jenkins/casc.yaml
      # 설치 마법사를 건너뛰고(계정은 JCasC가 생성), notifyCommit은 "폴링 요청"만 인증 없이 허용한다.
      # notifyCommit은 빌드를 직접 실행하지 않고 저장소 변경 여부를 확인하게 할 뿐이다 (변경이 없으면 아무 일도 없음).
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dhudson.plugins.git.GitStatus.NOTIFY_COMMIT_ACCESS_CONTROL=disabled-for-polling
        -Xmx1g
      GRADLE_USER_HOME: ${JENKINS_HOME_DIR}/.gradle
      # Testcontainers가 띄운 컨테이너의 포트는 호스트에 열린다. Jenkins 컨테이너에서는 호스트 주소로 접근한다.
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    volumes:
      - ${JENKINS_HOME_DIR}:${JENKINS_HOME_DIR}
      # 호스트 Docker 사용 (이미지 빌드, Testcontainers, 개발 환경 배포).
      # 소켓 접근은 호스트 root 권한과 같으므로 로컬 개발용 CI에서만 허용한다 (docs/cicd.md 보안 고려 사항).
      - /var/run/docker.sock:/var/run/docker.sock
      # 개발 환경 배포용 비밀값 파일 (Git 제외). JCasC가 Jenkins Secret File Credential(dev-env-file)로 등록한다.
      - ./.env.dev:/run/secrets/dev.env:ro
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    ports:
      - "127.0.0.1:${JENKINS_PORT:-8090}:8080"
    networks:
      - ci
    restart: unless-stopped

  nexus:
    image: sonatype/nexus3:3.82.0
    container_name: ci-nexus
    environment:
      INSTALL4J_ADD_VM_PARAMS: "-Xms1g -Xmx1g -XX:MaxDirectMemorySize=1g -Djava.util.prefs.userRoot=/nexus-data/javaprefs"
    volumes:
      - nexus-data:/nexus-data
    ports:
      # 8081: 웹 UI·REST API·Maven 저장소, 8082: Docker Registry(docker-hosted 저장소 전용 포트)
      - "127.0.0.1:${NEXUS_PORT:-8091}:8081"
      - "127.0.0.1:${NEXUS_REGISTRY_PORT:-8092}:8082"
    networks:
      - ci
    restart: unless-stopped

networks:
  ci:
    driver: bridge

volumes:
  gitea-data:
  nexus-data:
