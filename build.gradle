plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // JWT(Access Token) 검증과 인가. Keycloak이 발급한 토큰의 서명을 JWKS로 검증한다.
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Only the executable boot jar is needed in the container
tasks.named('jar') {
    enabled = false
}

// STEP 10 CI: core-api와 api-gateway에 공통으로 적용한다.
allprojects {
    plugins.withId('org.springframework.boot') {
        // CI 단계 분리. test(전체)는 그대로 두고, Docker(Testcontainers)가 필요한 테스트를 이름 규칙으로 나눈다.
        def integrationTestPatterns = ['**/*IntegrationTest*', '**/*ApplicationTests*', '**/Gateway*Test*']
        tasks.register('unitTest', Test) {
            description = 'Docker 없이 실행되는 테스트'
            group = 'verification'
            useJUnitPlatform()
            testClassesDirs = sourceSets.test.output.classesDirs
            classpath = sourceSets.test.runtimeClasspath
            exclude integrationTestPatterns
        }
        tasks.register('integrationTest', Test) {
            description = 'Testcontainers(PostgreSQL, Redis, WireMock)를 사용하는 테스트'
            group = 'verification'
            useJUnitPlatform()
            testClassesDirs = sourceSets.test.output.classesDirs
            classpath = sourceSets.test.runtimeClasspath
            include integrationTestPatterns
            shouldRunAfter 'unitTest'
        }

        // Nexus(Maven hosted)에 실행 JAR(bootJar)를 올린다. 주소와 계정은 Gradle 속성으로만 받는다 (CI: ORG_GRADLE_PROJECT_nexus*).
        apply plugin: 'maven-publish'
        publishing {
            publications {
                bootJava(MavenPublication) {
                    artifact tasks.named('bootJar')
                }
            }
            repositories {
                maven {
                    name = 'nexus'
                    url = providers.gradleProperty('nexusMavenUrl').orElse('http://localhost:8091/repository/maven-snapshots/')
                    // 로컬 개발용 Nexus는 HTTP다 (127.0.0.1/Docker 내부망 전용). 원격 Nexus는 HTTPS를 쓴다.
                    allowInsecureProtocol = true
                    credentials(PasswordCredentials)
                }
            }
        }
    }
}
